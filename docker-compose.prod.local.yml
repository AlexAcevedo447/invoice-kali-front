name: invoice-kali-front-prod-local

services:
  web:
    container_name: invoice-kali-front-prod-local
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18080}
    ports:
      - "${FRONTEND_PROD_LOCAL_HOST_PORT:-15081}:80"
    volumes:
      - ./nginx.local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend-prod-local-net

networks:
  frontend-prod-local-net:
    name: frontend-prod-local-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/16
