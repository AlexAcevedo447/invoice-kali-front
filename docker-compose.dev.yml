services:
  web:
    container_name: invoice-kali-front-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.dev
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://auth-api:8080}
      INVOICING_API_BASE_URL: ${INVOICING_API_BASE_URL:-http://invoice-api:8080}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-15173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: on-failure
    networks:
      - frontend-dev-net
      - kali-auth-dev-net
      - kali-dev-net

networks:
  frontend-dev-net:
    name: frontend-dev-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

  kali-auth-dev-net:
    external: true
    name: kali-auth-dev-net

  kali-dev-net:
    external: true
    name: kali-dev-net